name: Docker

on:
  push:
    branches:
      - main

  pull_request:

permissions: {}

jobs:
  docker:
    permissions:
      contents: read
      packages: write  # push to GHCR with GITHUB_TOKEN
      id-token: write  # sign the provenance attestations
      attestations: write  # store the attestations
    uses: chorrell/workflows/.github/workflows/docker-publish.yml@v1
    with:
      image-name: http
      test-command: docker run -i --rm "$IMAGE" --version
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
